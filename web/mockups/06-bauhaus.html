<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flashcard Generator — Bauhaus Geometric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@300..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0ebe1;
    --paper: #faf6ec;
    --ink: #1a1a1a;
    --red: #d72638;
    --blue: #1c4faf;
    --yellow: #f7c52b;
    --black: #0a0a0a;
  }
  *,*::before,*::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Archivo", system-ui, sans-serif;
    font-size: 16px; line-height: 1.5;
  }
  .layout { display: grid; grid-template-columns: 1fr 22rem; min-height: 100vh; }
  main { padding: 2.5rem; max-width: 64rem; margin: 0 auto; }
  aside {
    background: var(--paper); border-left: 4px solid var(--ink);
    padding: 2.5rem 1.5rem; position: relative;
  }
  header {
    display: grid; grid-template-columns: 8rem 1fr; gap: 2rem;
    align-items: stretch; margin-bottom: 3rem;
  }
  .header-blocks {
    display: grid; grid-template-rows: 4rem 4rem;
    gap: 4px;
  }
  .block { border: 2px solid var(--ink); }
  .block.red { background: var(--red); }
  .block.blue { background: var(--blue); }
  .block.yellow { background: var(--yellow); }
  .block.black { background: var(--black); }
  .block.split {
    background: linear-gradient(135deg, var(--red) 50%, var(--blue) 50%);
  }
  .header-blocks > div {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  }
  .header-content {}
  .eyebrow {
    font-family: "Archivo Black"; font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.25em;
    color: var(--blue); margin: 0 0 0.5rem;
  }
  h1 {
    font-family: "Archivo Black"; font-weight: 900;
    font-size: 5rem; line-height: 0.9; letter-spacing: -0.04em;
    text-transform: uppercase; margin: 0;
  }
  h1 .a { color: var(--red); }
  h1 .b { color: var(--blue); }
  .subtitle {
    font-family: "Archivo"; font-weight: 300; font-size: 1.1rem;
    color: var(--ink); margin: 1rem 0 0; max-width: 28rem;
  }
  .controls-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    border: 2px solid var(--ink); margin-bottom: 2rem;
  }
  .controls-grid > div { padding: 1rem 1.25rem; }
  .controls-grid > div:first-child { border-right: 2px solid var(--ink); background: var(--paper); }
  .controls-grid > div:last-child { background: var(--yellow); }
  .ctl-label {
    font-family: "Archivo Black"; font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.25em;
    margin-bottom: 0.5rem;
  }
  .topic-input {
    width: 100%; background: transparent; border: 0;
    border-bottom: 2px solid var(--ink);
    font-family: "Archivo"; font-size: 1.25rem; font-weight: 500;
    padding: 0.3rem 0; outline: none;
  }
  .quality-row { display: flex; gap: 0; }
  .quality-row button {
    flex: 1; background: var(--paper); border: 2px solid var(--ink);
    margin-right: -2px; padding: 0.5rem;
    font-family: "Archivo Black"; font-size: 0.85rem;
    text-transform: uppercase; cursor: pointer;
  }
  .quality-row button.on { background: var(--red); color: var(--paper); }
  .toolbar {
    display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0;
    border: 2px solid var(--ink); margin-bottom: 2.5rem;
  }
  .toolbar > * { padding: 1rem; border-right: 2px solid var(--ink); }
  .toolbar > *:last-child { border-right: 0; }
  .btn-primary {
    background: var(--red); color: var(--paper); border: 0;
    font-family: "Archivo Black"; font-size: 1.1rem;
    text-transform: uppercase; letter-spacing: 0.08em;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--ink); }
  .batch-wrap {
    background: var(--blue); color: var(--paper);
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  }
  .batch-wrap input {
    width: 3rem; background: transparent; border: 0;
    border-bottom: 2px solid var(--paper); color: var(--paper);
    font-family: "Archivo Black"; font-size: 1.3rem;
    text-align: center; padding: 0.2rem; outline: none;
  }
  .batch-wrap span { font-family: "Archivo Black"; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; }
  .btn-secondary {
    background: var(--yellow); color: var(--ink); border: 0;
    font-family: "Archivo Black"; font-size: 1rem;
    text-transform: uppercase; letter-spacing: 0.06em;
    cursor: pointer;
  }
  .btn-secondary:hover { background: var(--ink); color: var(--paper); }
  .rows {
    display: grid; grid-template-columns: 4rem repeat(2, 1fr);
    border: 2px solid var(--ink);
  }
  .rows > div {
    border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
    padding: 0;
  }
  .rows > div:nth-child(3n) { border-right: 0; }
  .rows > div.head {
    background: var(--ink); color: var(--paper);
    padding: 0.5rem 0.75rem;
    font-family: "Archivo Black"; font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.2em;
  }
  .rows > div.num {
    background: var(--paper);
    font-family: "Archivo Black"; font-size: 2rem;
    text-align: center; padding: 1rem 0;
    display: flex; align-items: center; justify-content: center;
  }
  .rows > div.num.r1 { color: var(--red); }
  .rows > div.num.r2 { color: var(--blue); }
  .rows > div.num.r3 { color: var(--ink); background: var(--yellow); }
  .rows > div.num.r4 { color: var(--paper); background: var(--blue); }
  .rows > div.num.r5 { color: var(--paper); background: var(--red); }
  .rows > div.num.r6 { color: var(--ink); }
  .rows .field-cell { background: var(--paper); padding: 0; }
  .rows input {
    width: 100%; height: 100%; background: transparent; border: 0;
    padding: 1rem; font-family: "Archivo"; font-size: 1rem;
    color: var(--ink); outline: none;
  }
  .rows input.word { font-family: "Archivo Black"; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .rows input::placeholder { color: rgba(0,0,0,0.3); font-weight: 300; text-transform: none; letter-spacing: 0; }
  .rows input:focus { background: var(--yellow); }
  aside .top { border-bottom: 4px solid var(--ink); padding-bottom: 1rem; }
  aside .top-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
  aside .swatch { width: 1rem; height: 1rem; background: var(--red); border: 2px solid var(--ink); }
  aside h2 {
    font-family: "Archivo Black"; font-size: 1.8rem;
    text-transform: uppercase; letter-spacing: -0.02em; margin: 0;
  }
  aside .count-block {
    background: var(--ink); color: var(--paper);
    display: inline-block; padding: 0.3rem 0.75rem;
    font-family: "Archivo Black"; font-size: 1.1rem;
    margin-top: 0.5rem;
  }
  aside input[type="search"] {
    width: 100%; background: var(--bg); border: 2px solid var(--ink);
    padding: 0.5rem 0.75rem; margin-top: 1.25rem;
    font-family: "Archivo"; outline: none;
  }
  .chips-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 0; margin-top: 1.5rem; border: 2px solid var(--ink);
  }
  .chips-grid span {
    padding: 0.5rem 0.6rem; font-family: "Archivo"; font-weight: 600;
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;
    border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
    background: var(--paper); text-align: center;
  }
  .chips-grid span:nth-child(3n) { border-right: 0; }
  .chips-grid span:nth-child(7n) { background: var(--red); color: var(--paper); }
  .chips-grid span:nth-child(5n) { background: var(--yellow); }
  .chips-grid span:nth-child(11n) { background: var(--blue); color: var(--paper); }
</style>
</head>
<body>
<div class="layout">
  <main>
    <header>
      <div class="header-blocks">
        <div>
          <div class="block red"></div>
          <div class="block yellow"></div>
        </div>
        <div>
          <div class="block blue"></div>
          <div class="block black"></div>
        </div>
      </div>
      <div class="header-content">
        <p class="eyebrow">FORM № 01 — Worksheet</p>
        <h1>FLASH<span class="a">CARD</span><br><span class="b">GENERATOR</span></h1>
        <p class="subtitle">A geometric instrument for printable kindergarten vocabulary. Six words. One page. Form follows function.</p>
      </div>
    </header>

    <div class="controls-grid">
      <div>
        <p class="ctl-label">Topic</p>
        <input class="topic-input" type="text" placeholder="animals · food · feelings">
      </div>
      <div>
        <p class="ctl-label">Quality</p>
        <div class="quality-row">
          <button>Low</button>
          <button class="on">Medium</button>
          <button>High</button>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn-primary">Suggest &amp; Generate</button>
      <div class="batch-wrap">
        <input value="1">
        <span>Batches</span>
      </div>
      <button class="btn-secondary">Batch Generate</button>
    </div>

    <div class="rows">
      <div class="head">№</div>
      <div class="head">Word</div>
      <div class="head">Sentence</div>

      <div class="num r1">1</div>
      <div class="field-cell"><input class="word" placeholder="word" value="duck"></div>
      <div class="field-cell"><input placeholder="sentence" value="I see a duck swim."></div>

      <div class="num r2">2</div>
      <div class="field-cell"><input class="word" placeholder="word" value="cake"></div>
      <div class="field-cell"><input placeholder="sentence" value="We eat cake today."></div>

      <div class="num r3">3</div>
      <div class="field-cell"><input class="word" placeholder="word"></div>
      <div class="field-cell"><input placeholder="sentence"></div>

      <div class="num r4">4</div>
      <div class="field-cell"><input class="word" placeholder="word"></div>
      <div class="field-cell"><input placeholder="sentence"></div>

      <div class="num r5">5</div>
      <div class="field-cell"><input class="word" placeholder="word"></div>
      <div class="field-cell"><input placeholder="sentence"></div>

      <div class="num r6">6</div>
      <div class="field-cell"><input class="word" placeholder="word"></div>
      <div class="field-cell"><input placeholder="sentence"></div>
    </div>
  </main>

  <aside>
    <div class="top">
      <div class="top-row">
        <span class="swatch"></span>
        <p class="eyebrow" style="margin:0;color:var(--red)">Index</p>
      </div>
      <h2>Used<br>Words</h2>
      <span class="count-block">260</span>
    </div>
    <input type="search" placeholder="search…">
    <div class="chips-grid">
      <span>ant</span><span>apple</span><span>are</span>
      <span>baby</span><span>bag</span><span>ball</span>
      <span>bear</span><span>bee</span><span>big</span>
      <span>bird</span><span>cake</span><span>cat</span>
      <span>cloud</span><span>cookie</span><span>cow</span>
      <span>dog</span><span>duck</span><span>egg</span>
    </div>
  </aside>
</div>
</body>
</html>
