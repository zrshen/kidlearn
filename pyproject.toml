[project]
name = "kidlearn"
version = "0.1.0"
description = "Generator for printable kid-education materials (flashcards, math, science worksheets)."
requires-python = ">=3.12.9"
dependencies = [
    "fastapi>=0.136.1",
    "openai>=2.37.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
