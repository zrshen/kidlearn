[project]
name = "kidlearn"
version = "0.1.0"
description = "Generator for printable kid-education materials (flashcards, math, science worksheets)."
requires-python = ">=3.12.9"
dependencies = [
    "fastapi>=0.136.1",
    "openai>=2.37.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E402: load_dotenv() must run before app imports (server/main.py, flashcard_lib.py).
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E401", "E702"]  # compact, intentional test style
